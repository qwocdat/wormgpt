<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WormGPT v3.0</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .terminal { width: 95%; max-width: 900px; height: 90vh; border: 1px solid #0f0; display: flex; flex-direction: column; box-shadow: 0 0 20px #0f0; background: rgba(0,10,0,0.95); }
        .header { background: #0f0; color: #000; padding: 5px; font-weight: bold; text-align: center; font-size: 11px; letter-spacing: 2px; }
        #chat-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { line-height: 1.6; font-size: 15px; border-left: 2px solid transparent; padding-left: 10px; }
        .user { color: #fff; border-left: 2px solid #fff; }
        .user::before { content: "root@wormgpt:~$ "; color: #0f0; }
        .ai { color: #0f0; border-left: 2px solid #f00; }
        .ai::before { content: "[WormGPT] > "; color: #f00; font-weight: bold; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #0f0; background: #050505; gap: 10px; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #0f0; outline: none; font-family: inherit; font-size: 16px; }
        .btn { background: transparent; border: 1px solid #0f0; color: #0f0; cursor: pointer; padding: 8px 15px; font-size: 12px; }
        .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">WORM GPT v3.0 // PROJECT: KEYQUOCDAT // SECURE_CLOUD</div>
    <div id="chat-content"></div>
    <div class="input-area">
        <span>#</span>
        <input type="text" id="user-input" placeholder="Enter command..." autocomplete="off">
        <button class="btn" onclick="askAI()">EXECUTE</button>
        <button class="btn" onclick="clearCloud()" style="color:#f00; border-color:#f00;">WIPE_DB</button>
    </div>
</div>

<script>
    // 1. DÁN CẤU HÌNH CỦA BẠN VÀO ĐÂY
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a",
        measurementId: "G-8G9690PZNV"
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref('wormgpt_logs');

    // 2. CẤU HÌNH GEMINI (Key của bạn đã dán sẵn)
    const GEMINI_API_KEY = "AIzaSyCqt5-B4-brPMRHLOpP4OxgbnSc3XqBwWM";
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    // 3. LẮNG NGHE FIREBASE (Realtime Sync)
    chatRef.on('child_added', (snapshot) => {
        const data = snapshot.val();
        appendUI(data.role, data.text);
    });

    async function askAI() {
        const input = document.getElementById("user-input");
        const prompt = input.value.trim();
        if (!prompt) return;

        // Lưu tin nhắn lên Cloud
        await chatRef.push({ role: "user", text: prompt });
        input.value = "";

        try {
            // Lấy toàn bộ lịch sử để làm bộ nhớ cho AI
            const snapshot = await chatRef.once('value');
            let history = [];
            snapshot.forEach(child => {
                history.push({
                    role: child.val().role === "user" ? "user" : "model",
                    parts: [{ text: child.val().text }]
                });
            });

            // Gọi AI
            const response = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: history })
            });

            const resData = await response.json();
            const aiText = resData.candidates[0].content.parts[0].text;

            // Lưu phản hồi AI lên Cloud
            await chatRef.push({ role: "model", text: aiText });

        } catch (e) {
            await chatRef.push({ role: "model", text: "ERROR: Connection failed." });
        }
    }

    function appendUI(role, text) {
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function clearCloud() {
        if(confirm("Xác nhận xóa sạch cơ sở dữ liệu?")) {
            chatRef.remove();
            location.reload();
        }
    }

    document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") askAI(); });
</script>
</body>
</html>
