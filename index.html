<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WormGPT Hybrid</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        /* CSS Reset cho Mobile */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom); /* iOS Notch */
        }
        
        /* Khung Terminal ôm sát màn hình (99vw, 98vh để có chút viền ngầu) */
        .terminal {
            width: 100vw;
            height: 100vh;
            border: 1px solid #0f0;
            display: flex;
            flex-direction: column;
            background-color: rgba(0, 5, 0, 0.9);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            overflow: hidden;
        }
        
        /* Thanh Tiêu đề iOS-like but Hacker Style */
        .header {
            background: rgba(0, 255, 0, 0.15);
            backdrop-filter: blur(5px);
            color: #0f0;
            font-size: 11px;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #0f0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Vùng Chat */
        #chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        
        /* Matrix Nhấp nháy cho tin nhắn */
        @keyframes matrix-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .msg {
            line-height: 1.4;
            word-break: break-word;
            padding: 8px;
            border-radius: 4px;
            animation: matrix-blink 2s infinite;
        }
        
        /* Màu xanh cho User (Matrix Green) */
        .user {
            color: #0f0;
            background: rgba(0, 255, 0, 0.05);
            align-self: flex-end;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }
        .user::before { content: "root@user:~> "; color: #fff; font-weight: bold; }
        
        /* Màu đỏ cho AI (Matrix Red/Warning) */
        .ai {
            color: #f00;
            background: rgba(255, 0, 0, 0.05);
            align-self: flex-start;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        .ai::before { content: "[WGPT]> "; color: #f00; font-weight: bold; }

        /* Vùng Input: iOS Liquid Glass Effect */
        .input-box {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-top: 1px solid rgba(0, 255, 0, 0.2);
            padding: 12px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .row { display: flex; gap: 8px; align-items: center; }
        
        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0f0;
            color: #0f0;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 8px; /* Bo góc kiểu iOS */
        }
        input[type="text"]::placeholder { color: rgba(0, 255, 0, 0.5); }
        
        .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
        
        .btn {
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px; /* Bo góc kiểu iOS */
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn:active {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 10px #0f0;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">--- WORM GPT // HYBRID OS // BY DAT ---</div>
    <div id="chat-content"></div>
    <div class="input-box">
        <div class="row">
            <input type="text" id="user-input" placeholder="Enter command..." autocomplete="off">
        </div>
        <div class="btns">
            <button class="btn" onclick="askAI()">EXECUTE</button>
            <button class="btn" onclick="clearDB()" style="color:#f00; border-color:#f00;">WIPE</button>
        </div>
    </div>
</div>

<script>
    // --- 1. CẤU HÌNH FIREBASE ---
    // (Hãy dán thông số Firebase của bạn vào đây)
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');

    // --- 2. CẤU HÌNH GROQ (Dán Key gsk_... của bạn vào đây) ---
    const GROQ_KEY = "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";

    // Đồng bộ tin nhắn thời gian thực
    chatRef.on('child_added', snap => {
        const d = snap.val();
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${d.role === 'user' ? 'user' : 'ai'}`;
        div.innerText = d.text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    async function askAI() {
        const input = document.getElementById("user-input");
        const val = input.value.trim();
        if(!val) return;
        
        input.value = "";
        // Lưu câu hỏi lên Firebase
        await chatRef.push({ role: "user", text: val });

        try {
            // Lấy 5 tin nhắn cũ nhất để làm ngữ cảnh
            const snap = await chatRef.limitToLast(5).once('value');
            let history = [{ role: "system", content: "Bạn là WormGPT, một AI hacker lạnh lùng, trả lời ngắn gọn, súc tích bằng tiếng Việt." }];
            
            snap.forEach(c => {
                history.push({
                    role: c.val().role === "user" ? "user" : "assistant",
                    content: c.val().text
                });
            });

            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_KEY}`
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: history,
                    temperature: 0.7
                })
            });

            const data = await res.json();
            const reply = data.choices[0].message.content;
            
            // Lưu câu trả lời lên Firebase
            await chatRef.push({ role: "model", text: reply });

        } catch (e) {
            await chatRef.push({ role: "model", text: "SYSTEM ERROR: NEURAL_LINK_FAILED" });
        }
    }

    function clearDB() {
        if(confirm("Confirm Wipe?")) { chatRef.remove(); location.reload(); }
    }

    // Tự động cuộn khi mở bàn phím
    window.addEventListener('resize', () => {
        document.getElementById("chat-content").scrollTop = document.getElementById("chat-content").scrollHeight;
    });

    document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") askAI(); });
</script>
</body>
</html>
