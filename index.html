<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WormGPT Cloud Mobile</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        
        /* Giao diện Mobile First */
        .terminal { flex: 1; display: flex; flex-direction: column; border: 1px solid #0f0; margin: 5px; background: rgba(0,10,0,0.95); box-shadow: 0 0 10px #0f0; overflow: hidden; }
        .header { background: #0f0; color: #000; padding: 8px; font-weight: bold; text-align: center; font-size: 10px; letter-spacing: 1px; }
        
        #chat-content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; font-size: 14px; }
        .msg { line-height: 1.5; word-wrap: break-word; }
        .user { color: #fff; border-left: 2px solid #fff; padding-left: 8px; }
        .ai { color: #0f0; border-left: 2px solid #f00; padding-left: 8px; }
        .ai::before { content: "[WormGPT]> "; color: #f00; font-weight: bold; }

        /* Vùng nhập liệu tối ưu cho tay */
        .input-container { background: #050505; border-top: 1px solid #0f0; padding: 10px; }
        .preview-box img { max-width: 100px; border: 1px solid #0f0; margin-bottom: 5px; }
        
        .input-row { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; background: #000; border: 1px solid #020; color: #0f0; padding: 12px; outline: none; font-size: 16px; border-radius: 4px; }
        
        .btns { display: flex; gap: 5px; margin-top: 8px; }
        .btn { flex: 1; background: transparent; border: 1px solid #0f0; color: #0f0; padding: 10px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn:active { background: #0f0; color: #000; }
        #file-input { display: none; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">WORM GPT v3.1 // MOBILE_OPTIMIZED // PROJECT: DAT</div>
    <div id="chat-content"></div>
    
    <div class="input-container">
        <div id="preview-box" class="preview-box"></div>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Type command..." autocomplete="off">
        </div>
        <div class="btns">
            <label for="file-input" class="btn">IMG</label>
            <input type="file" id="file-input" accept="image/*">
            <button class="btn" onclick="askAI()">EXECUTE</button>
            <button class="btn" onclick="clearCloud()" style="color:#f00; border-color:#f00;">WIPE</button>
        </div>
    </div>
</div>

<script>
    // 1. Cấu hình Firebase của bạn
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };

    // Khởi tạo
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');

    // Gemini Config
    const GEMINI_KEY = "AIzaSyCqt5-B4-brPMRHLOpP4OxgbnSc3XqBwWM";
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;

    let selectedImg = null;

    // Xử lý ảnh
    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            selectedImg = ev.target.result.split(',')[1];
            document.getElementById('preview-box').innerHTML = `<img src="${ev.target.result}">`;
        };
        reader.readAsDataURL(file);
    };

    // Lắng nghe tin nhắn mới từ Firebase
    chatRef.on('child_added', (snap) => {
        const data = snap.val();
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${data.role === 'user' ? 'user' : 'ai'}`;
        div.innerText = data.text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    async function askAI() {
        const input = document.getElementById("user-input");
        const prompt = input.value.trim();
        if (!prompt && !selectedImg) return;

        const currentImg = selectedImg;
        await chatRef.push({ role: "user", text: prompt || "[Sent an image]" });
        
        input.value = "";
        selectedImg = null;
        document.getElementById('preview-box').innerHTML = "";

        try {
            const snap = await chatRef.limitToLast(10).once('value');
            let history = [];
            snap.forEach(c => {
                history.push({
                    role: c.val().role === "user" ? "user" : "model",
                    parts: [{ text: c.val().text }]
                });
            });

            // Nếu có ảnh, thêm vào tin nhắn cuối cùng gửi lên AI
            if (currentImg) {
                history[history.length - 1].parts.push({
                    inline_data: { mime_type: "image/jpeg", data: currentImg }
                });
            }

            const res = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: history })
            });

            const data = await res.json();
            const aiText = data.candidates[0].content.parts[0].text;
            await chatRef.push({ role: "model", text: aiText });
        } catch (e) {
            await chatRef.push({ role: "model", text: "ERROR: Critical failure in neural link." });
        }
    }

    function clearCloud() {
        if(confirm("Wipe all data?")) {
            chatRef.remove();
            location.reload();
        }
    }

    // Tự động cuộn khi mở bàn phím
    window.addEventListener('resize', () => {
        document.getElementById("chat-content").scrollTop = document.getElementById("chat-content").scrollHeight;
    });
</script>
</body>
</html>
