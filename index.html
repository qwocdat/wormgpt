<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WormGPT v5.0 - Web2App</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        /* Tối ưu hóa Web2App: Không viền, không cuộn body */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden; /* Ép không cho body cuộn */
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom); /* Tương thích iPhone Notch */
        }

        /* Matrix Background */
        canvas#matrix-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; opacity: 0.15;
        }

        /* Terminal ôm sát màn hình (Web2App) */
        .terminal {
            flex: 1; display: flex; flex-direction: column;
            border: none; /* Bỏ viền thừa */
            background: rgba(0, 5, 0, 0.9);
            z-index: 1; position: relative;
            overflow: hidden;
        }

        /* Thanh Tiêu đề cực gọn */
        .header {
            background: #0f0; color: #000;
            font-size: 10px; padding: 5px;
            text-align: center; font-weight: bold;
            text-transform: uppercase;
        }

        /* Vùng Chat: Cho phép vuốt chạm và tự cuộn */
        #chat-content {
            flex: 1; overflow-y: auto;
            padding: 15px; font-size: 15px;
            display: flex; flex-direction: column;
            gap: 12px; scroll-behavior: smooth;
        }

        /* Phong cách Tin nhắn */
        .msg {
            line-height: 1.4; word-break: break-word;
            padding: 10px; border-radius: 8px;
            max-width: 85%;
            animation: matrix-blink 2s infinite;
        }

        /* User: Xanh Ma Trận */
        .user {
            color: #fff; background: rgba(0, 255, 0, 0.1);
            align-self: flex-end; border: 1px solid rgba(0, 255, 0, 0.3);
        }
        .user::before { content: "> "; color: #0f0; font-weight: bold; }

        /* AI: Nửa Đỏ Nửa Xanh Nhấp Nháy */
        .ai {
            color: #f00; background: rgba(255, 0, 0, 0.08);
            align-self: flex-start; border: 1px solid rgba(255, 0, 0, 0.3);
            position: relative;
        }
        .ai::before { content: "[WGPT]"; color: #f00; font-weight: bold; margin-right: 5px; }

        /* Hiệu ứng Đỏ - Xanh cho nội dung AI */
        .ai-text {
            color: #0f0;
            animation: red-green-blink 1s infinite alternate;
        }
        @keyframes red-green-blink {
            0% { color: #0f0; text-shadow: 0 0 5px #f00; }
            100% { color: #f00; text-shadow: 0 0 5px #0f0; }
        }

        /* Con trỏ nhấp nháy cho hiệu ứng đánh chữ */
        .typing-cursor {
            display: inline-block; width: 8px; height: 15px;
            background: #f00; margin-left: 2px;
            animation: cursor-blink 0.7s infinite;
        }
        @keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Vùng Input: Liquid Glass - Vuốt chạm dễ dàng */
        .input-box {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 255, 0, 0.2);
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }

        .row { display: flex; gap: 8px; align-items: center; }

        input[type="text"] {
            flex: 1; background: rgba(0, 0, 0, 0.6);
            border: 1px solid #0f0; color: #0f0;
            padding: 15px; font-size: 16px; font-family: inherit;
            border-radius: 12px; /* Bo góc iOS */
        }
        input[type="text"]::placeholder { color: rgba(0, 255, 0, 0.4); }

        .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

        .btn {
            background: transparent; border: 1px solid #0f0;
            color: #0f0; padding: 12px;
            font-size: 13px; font-weight: bold;
            cursor: pointer; border-radius: 10px;
            text-transform: uppercase; transition: 0.2s;
        }
        .btn:active { background: #0f0; color: #000; box-shadow: 0 0 10px #0f0; transform: scale(0.98); }
    </style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div class="terminal">
    <div class="header">--- WORM GPT // PROJECT_BY: quocdat // WEB2APP_V5.0 ---</div>
    <div id="chat-content"></div>
    <div class="input-box">
        <div class="row">
            <input type="text" id="user-input" placeholder="Enter command..." autocomplete="off">
        </div>
        <div class="btns">
            <button class="btn" onclick="askAI()">EXECUTE</button>
            <button class="btn" onclick="clearDB()" style="color:#f00; border-color:#f00;">WIPE_DB</button>
        </div>
    </div>
</div>

<script>
    // --- CẤU HÌNH FIREBASE CỦA QUOCDAT ---
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');

    // --- CẤU HÌNH GROQ (KEY ĐÃ FIX) ---
    // Tôi đã tự động Trim khoảng trắng để bypass lỗi 400.
    const GROQ_KEY = "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".trim();
    const GEMINI_URL = `https://api.groq.com/openai/v1/chat/completions`;

    // --- HIỆU ỨNG MA TRẬN MẠNG NHỆN ---
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const fontSize = 10;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);

    // --- ĐỒNG BỘ TIN NHẮN THỜI GIAN THỰC ---
    chatRef.on('child_added', snap => {
        const d = snap.val();
        appendMessage(d.role, d.text, false); // false = không dùng hiệu ứng đánh chữ khi load tin cũ
    });

    // --- HÀM THÊM TIN NHẮN VÀO GIAO DIỆN ---
    // role: user/model, text: nội dung, isTyping: có hiệu ứng đánh chữ không
    function appendMessage(role, text, isTyping) {
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

        if (role === 'model' && isTyping) {
            // Nếu là AI và cần hiệu ứng đánh chữ
            div.innerHTML = `<span class="ai-text"></span><span class="typing-cursor"></span>`;
            box.appendChild(div);
            typeText(div.querySelector('.ai-text'), text, 0);
        } else if (role === 'model') {
            // Nếu là AI và KHÔNG cần hiệu ứng (load tin cũ)
            div.innerHTML = `<span class="ai-text">${text}</span>`;
            box.appendChild(div);
        } else {
            // Nếu là User
            div.innerText = text;
            box.appendChild(div);
        }
        
        box.scrollTop = box.scrollHeight;
    }

    // --- HÀM TẠO HIỆU ỨNG ĐÁNH CHỮ (TYPEWRITER) ---
    function typeText(element, text, index) {
        if (index < text.length) {
            element.innerText += text.charAt(index);
            index++;
            setTimeout(() => typeText(element, text, index), 30); // 30ms = Tốc độ gõ chữ
            document.getElementById("chat-content").scrollTop = document.getElementById("chat-content").scrollHeight;
        } else {
            // Xóa con trỏ khi gõ xong
            const cursor = element.nextSibling;
            if (cursor && cursor.classList.contains('typing-cursor')) {
                cursor.remove();
            }
        }
    }

    async function askAI() {
        const input = document.getElementById("user-input");
        const prompt = input.value.trim();
        if(!prompt) return;

        input.value = "";
        // Lưu câu hỏi lên Firebase
        await chatRef.push({ role: "user", text: prompt });

        try {
            // Lấy 5 tin nhắn cũ nhất để làm ngữ cảnh
            const snapshot = await chatRef.limitToLast(5).once('value');
            let history = [{ role: "system", content: "Bạn là WormGPT, một AI hacker lạnh lùng, trả lời ngắn gọn, súc tích bằng tiếng Việt." }];
            
            snapshot.forEach(c => {
                const val = c.val();
                history.push({
                    role: val.role === "user" ? "user" : "assistant",
                    content: val.text
                });
            });

            // Gọi AI
            const res = await fetch(GEMINI_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_KEY}`
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant", // Model ổn định nhất hiện tại
                    messages: history,
                    temperature: 0.7
                })
            });

            if (!res.ok) throw new Error("HTTTP " + res.status);
            const data = await res.json();
            const reply = data.choices[0].message.content;
            
            // Hiển thị AI trả lời với hiệu ứng gõ chữ
            appendMessage("model", reply, true);
            // Lưu phản hồi lên Firebase
            await chatRef.push({ role: "model", text: reply });

        } catch (e) {
            appendMessage("model", "SYSTEM ERROR: API_LINK_BROKEN. Hãy kiểm tra lại mạng lưới!", true);
        }
    }

    function clearDB() { if(confirm("Confirm Wipe database?")) { chatRef.remove(); location.reload(); } }

    // Tự động cuộn khi mở bàn phím
    window.addEventListener('resize', () => {
        document.getElementById("chat-content").scrollTop = document.getElementById("chat-content").scrollHeight;
    });

    document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") askAI(); });
</script>
</body>
</html>
