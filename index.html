<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WormGPT v4.0 Final</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Hiệu ứng Mạng nhện Ma trận */
        canvas#matrix-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        .terminal {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #0f0;
            margin: 5px;
            background: rgba(0, 10, 0, 0.85);
            z-index: 1;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .header {
            background: #0f0;
            color: #000;
            font-size: 10px;
            padding: 5px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 10px #0f0;
        }

        #chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Tin nhắn phong cách Hacker */
        .msg {
            line-height: 1.5;
            word-break: break-word;
            padding: 10px;
            border-radius: 8px;
            max-width: 90%;
        }

        .user {
            color: #fff;
            align-self: flex-end;
            background: rgba(0, 255, 0, 0.1);
            border-right: 3px solid #0f0;
        }
        .user::before { content: "ROOT@DAT: "; color: #0f0; font-size: 11px; font-weight: bold; }

        /* AI Nửa đỏ nửa xanh nhấp nháy */
        .ai {
            align-self: flex-start;
            background: rgba(255, 0, 0, 0.1);
            border-left: 3px solid #f00;
            animation: red-green-border 1.5s infinite alternate;
        }
        
        .ai-content {
            animation: red-green-text 0.5s infinite alternate;
            font-weight: bold;
        }

        @keyframes red-green-text {
            0% { color: #0f0; text-shadow: 0 0 8px #f00; }
            100% { color: #f00; text-shadow: 0 0 8px #0f0; }
        }
        @keyframes red-green-border {
            0% { border-color: #f00; box-shadow: 0 0 5px #f00; }
            100% { border-color: #0f0; box-shadow: 0 0 5px #0f0; }
        }

        /* Input Glassmorphism iOS */
        .input-area {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 255, 0, 0.3);
            padding: 15px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #0f0;
            color: #0f0;
            padding: 15px;
            font-size: 16px;
            border-radius: 12px;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        
        .btn {
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:active { background: #0f0; color: #000; }
    </style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div class="terminal">
    <div class="header">WORM_GPT_v4.0 // FINAL_FIX // SPIDER_NET</div>
    <div id="chat-content"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Execute command..." autocomplete="off">
        <div class="btns">
            <button class="btn" onclick="askAI()">SEND_PACKET</button>
            <button class="btn" onclick="clearLogs()" style="color:#f00; border-color:#f00;">WIPE</button>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');

    // --- GROQ CONFIG ---
    const GROQ_KEY = "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";

    // Matrix Background Animation
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
    const fontSize = 10;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);

    // Sync Messages
    chatRef.on('child_added', snap => {
        const d = snap.val();
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${d.role === 'user' ? 'user' : 'ai'}`;
        
        if(d.role === 'model') {
            div.innerHTML = `<span class="ai-content">${d.text}</span>`;
        } else {
            div.innerText = d.text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    async function askAI() {
        const input = document.getElementById("user-input");
        const val = input.value.trim();
        if(!val) return;
        
        input.value = "";
        await chatRef.push({ role: "user", text: val });

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_KEY}`
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        {role: "system", content: "Bạn là WormGPT, hacker lạnh lùng. Trả lời cực ngắn bằng tiếng Việt."},
                        {role: "user", content: val}
                    ]
                })
            });

            if (!res.ok) throw new Error("HTTP " + res.status);
            
            const data = await res.json();
            const reply = data.choices[0].message.content;
            await chatRef.push({ role: "model", text: reply });

        } catch (e) {
            await chatRef.push({ role: "model", text: "ERR: CONNECTION_TIMEOUT_" + e.message });
        }
    }

    function clearLogs() { if(confirm("Wipe database?")) { chatRef.remove(); location.reload(); } }
    document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") askAI(); });
</script>
</body>
</html>
