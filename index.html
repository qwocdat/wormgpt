<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WormGPT Fix</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #0f0; font-family: monospace; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .terminal { flex: 1; display: flex; flex-direction: column; border: 1px solid #0f0; margin: 2px; }
        .header { background: #0f0; color: #000; font-size: 10px; padding: 3px; text-align: center; }
        #chat-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
        .msg { margin-bottom: 10px; line-height: 1.4; }
        .user { color: #fff; }
        .ai { color: #0f0; }
        .input-box { padding: 10px; border-top: 1px solid #0f0; background: #000; }
        input { width: 100%; background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; outline: none; margin-bottom: 5px; }
        .btns { display: flex; gap: 5px; }
        .btn { flex: 1; background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">SYSTEM ONLINE // WORM_GPT_V3.3</div>
        <div id="chat-content"></div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Nhập lệnh..." autocomplete="off">
            <div class="btns">
                <button class="btn" onclick="askAI()">SEND</button>
                <button class="btn" onclick="chatRef.remove();location.reload()" style="color:red;border-color:red">WIPE</button>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };

    firebase.initializeApp(firebaseConfig);
    const chatRef = firebase.database().ref('wormgpt_logs');
    const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyCqt5-B4-brPMRHLOpP4OxgbnSc3XqBwWM";

    chatRef.on('child_added', snap => {
        const d = snap.val();
        const div = document.createElement("div");
        div.className = "msg " + (d.role === 'user' ? 'user' : 'ai');
        div.innerText = (d.role === 'user' ? "> " : "[WGPT]: ") + d.text;
        document.getElementById("chat-content").appendChild(div);
        document.getElementById("chat-content").scrollTop = document.getElementById("chat-content").scrollHeight;
    });

    async function askAI() {
        const input = document.getElementById("user-input");
        const val = input.value.trim();
        if(!val) return;
        
        input.value = "";
        await chatRef.push({ role: "user", text: val });

        try {
            // FIX QUAN TRỌNG: Chỉ gửi đúng 1 tin nhắn hiện tại để test xem API có sống không
            const body = { contents: [{ parts: [{ text: val }] }] };
            
            const res = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            const data = await res.json();
            const reply = data.candidates[0].content.parts[0].text;
            await chatRef.push({ role: "model", text: reply });
        } catch (e) {
            await chatRef.push({ role: "model", text: "Lỗi kết nối API. Hãy kiểm tra lại Key!" });
        }
    }
</script>
</body>
</html>
