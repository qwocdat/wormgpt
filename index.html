<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WormGPT v4.1 - Fix 400</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: #000; color: #0f0; font-family: monospace; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.2; }
        .terminal { flex: 1; display: flex; flex-direction: column; border: 1px solid #0f0; margin: 5px; background: rgba(0,0,0,0.8); z-index: 1; }
        .header { background: #0f0; color: #000; font-size: 10px; padding: 5px; text-align: center; font-weight: bold; }
        #chat-content { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 85%; line-height: 1.4; }
        .user { align-self: flex-end; background: rgba(0,255,0,0.1); border: 1px solid #0f0; color: #fff; }
        .ai { align-self: flex-start; background: rgba(255,0,0,0.1); border: 1px solid #f00; animation: blink 0.5s infinite alternate; }
        @keyframes blink { 0% { border-color: #f00; color: #f00; } 100% { border-color: #0f0; color: #0f0; } }
        .input-area { background: rgba(20,20,20,0.9); padding: 15px; border-top: 1px solid #0f0; }
        input { width: 100%; background: #000; border: 1px solid #0f0; color: #0f0; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
        .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
        button { background: transparent; border: 1px solid #0f0; color: #0f0; padding: 10px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
<canvas id="m"></canvas>
<div class="terminal">
    <div class="header">WORM_GPT_v4.1 // STATUS: FIXING_400</div>
    <div id="chat-content"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Execute..." autocomplete="off">
        <div class="btns">
            <button onclick="askAI()">SEND</button>
            <button onclick="db.ref('wormgpt_logs').remove();location.reload()" style="color:red;border-color:red">WIPE</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');

    // FIX KEY: Đảm bảo không có khoảng trắng thừa
    const GROQ_KEY = "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".trim();

    // Matrix Rain Effect
    const c = document.getElementById('m'), q = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const s = Array(256).fill(0);
    setInterval(() => {
        q.fillStyle = "rgba(0,0,0,0.05)"; q.fillRect(0,0,c.width,c.height);
        q.fillStyle = "#0f0";
        s.forEach((y, i) => {
            q.fillText(String.fromCharCode(33+Math.random()*96), i*10, y);
            s[i] = y > 758 + Math.random()*1e4 ? 0 : y + 10;
        });
    }, 33);

    chatRef.on('child_added', snap => {
        const d = snap.val();
        const div = document.createElement("div");
        div.className = `msg ${d.role === 'user' ? 'user' : 'ai'}`;
        div.innerText = (d.role === 'user' ? "DAT: " : "WGPT: ") + d.text;
        document.getElementById("chat-content").appendChild(div);
        document.getElementById("chat-content").scrollTop = 99999;
    });

    async function askAI() {
        const input = document.getElementById("user-input");
        const val = input.value.trim();
        if(!val) return;
        input.value = "";
        await chatRef.push({ role: "user", text: val });

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_KEY}`
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant", // Model ổn định nhất hiện tại
                    messages: [{role: "user", content: val}]
                })
            });

            const data = await res.json();
            if (data.error) throw new Error(data.error.message);
            await chatRef.push({ role: "model", text: data.choices[0].message.content });
        } catch (e) {
            await chatRef.push({ role: "model", text: "SYSTEM ERROR: " + e.message });
        }
    }
</script>
</body>
</html>
