<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WormGPT v3.8 - Spider Matrix</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Hiệu ứng Matrix Mạng Nhện */
        .terminal {
            flex: 1; display: flex; flex-direction: column; border: 1px solid #0f0; margin: 2px;
            background-color: #000;
            background-image: radial-gradient(circle, rgba(0, 255, 0, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative; overflow: hidden;
        }

        .header { background: #0f0; color: #000; font-size: 10px; padding: 4px; text-align: center; font-weight: bold; letter-spacing: 2px; }
        
        #chat-content { flex: 1; overflow-y: auto; padding: 15px; font-size: 15px; display: flex; flex-direction: column; gap: 12px; z-index: 2; }
        
        .msg { line-height: 1.5; word-break: break-word; padding: 8px; border-radius: 5px; position: relative; }
        .user { color: #fff; background: rgba(0, 255, 0, 0.1); border: 1px solid #0f0; align-self: flex-end; max-width: 85%; }
        .user::before { content: "root@dat:~# "; color: #0f0; font-size: 12px; }

        /* AI Nửa đỏ nửa xanh nhấp nháy */
        .ai { background: rgba(255, 0, 0, 0.1); border: 1px solid #f00; align-self: flex-start; max-width: 85%; animation: border-glow 2s infinite alternate; }
        .ai-text { animation: red-green-text 0.8s infinite alternate; font-weight: bold; }
        
        @keyframes red-green-text {
            0% { color: #0f0; text-shadow: 0 0 5px #f00; }
            100% { color: #f00; text-shadow: 0 0 5px #0f0; }
        }
        @keyframes border-glow {
            from { box-shadow: 0 0 5px #f00; }
            to { box-shadow: 0 0 15px #0f0; }
        }

        /* Input kiểu Liquid Glass */
        .input-area {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid #0f0;
            padding: 15px;
            z-index: 3;
        }
        input[type="text"] {
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid #0f0;
            color: #0f0; padding: 12px; font-size: 16px; font-family: inherit; border-radius: 10px; margin-bottom: 10px;
        }
        .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        .btn {
            background: transparent; border: 1px solid #0f0; color: #0f0;
            padding: 12px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 10px;
        }
        .btn:active { background: #0f0; color: #000; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">WORM_GPT_V3.8 // ENGINE: LLAMA3_GROQ // STATUS: ENCRYPTED</div>
    <div id="chat-content"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Execute command..." autocomplete="off">
        <div class="btns">
            <button class="btn" onclick="askAI()">EXECUTE</button>
            <button class="btn" onclick="clearDB()" style="color:#f00; border-color:#f00;">WIPE</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');

    // KEY ĐÃ ĐƯỢC DÁN TẠI ĐÂY
    const GROQ_KEY = "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";

    chatRef.on('child_added', snap => {
        const d = snap.val();
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${d.role === 'user' ? 'user' : 'ai'}`;
        
        if(d.role === 'model') {
            div.innerHTML = `<span class="ai-text">${d.text}</span>`;
        } else {
            div.innerText = d.text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    async function askAI() {
        const input = document.getElementById("user-input");
        const val = input.value.trim();
        if(!val) return;
        
        input.value = "";
        await chatRef.push({ role: "user", text: val });

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_KEY}`
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        {role: "system", content: "Bạn là WormGPT, AI hacker nguy hiểm. Trả lời cực ngắn gọn bằng tiếng Việt, phong cách lạnh lùng."},
                        {role: "user", content: val}
                    ]
                })
            });

            const data = await response.json();
            const reply = data.choices[0].message.content;
            await chatRef.push({ role: "model", text: reply });
        } catch (e) {
            await chatRef.push({ role: "model", text: "CONNECTION_ERROR: Bộ não AI đã bị ngắt kết nối." });
        }
    }

    function clearDB() { if(confirm("Xóa sạch dấu vết?")) { chatRef.remove(); location.reload(); } }
    document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") askAI(); });
</script>
</body>
</html>
