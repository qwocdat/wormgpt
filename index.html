<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WormGPT v5.3 - Final Fix</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #000; 
            color: #0f0; 
            font-family: 'Consolas', 'Courier New', monospace; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.2; }

        /* Vùng hiển thị chat */
        #chat-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            z-index: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            padding-bottom: 20px;
        }

        .header { 
            background: #0f0; color: #000; 
            font-size: 10px; padding: 5px; 
            text-align: center; font-weight: bold; 
            z-index: 10;
        }

        .msg { padding: 12px; border-radius: 10px; max-width: 85%; line-height: 1.5; font-size: 15px; position: relative; z-index: 2; }
        .user { align-self: flex-end; background: rgba(0, 255, 0, 0.1); border: 1px solid #0f0; color: #fff; }
        .ai { align-self: flex-start; background: rgba(255, 0, 0, 0.1); border: 1px solid #f00; color: #f00; }
        
        .ai-text { animation: glow 1.5s infinite alternate; }
        @keyframes glow { 0% { color: #0f0; } 100% { color: #f00; } }

        /* KHU VỰC NHẬP LIỆU - QUAN TRỌNG */
        .input-container {
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid #0f0;
            padding: 15px;
            z-index: 100; /* Đảm bảo luôn nổi lên trên */
            position: relative;
        }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }

        input { 
            flex: 1; 
            background: #000; 
            border: 1px solid #0f0; 
            color: #0f0; 
            padding: 15px; 
            font-size: 16px; 
            border-radius: 8px;
            font-family: inherit;
        }

        .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        .btn { 
            background: transparent; border: 1px solid #0f0; 
            color: #0f0; padding: 12px; font-weight: bold; 
            border-radius: 8px; text-transform: uppercase;
        }
        .btn:active { background: #0f0; color: #000; }

        .cursor { display: inline-block; width: 8px; height: 15px; background: #f00; margin-left: 2px; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="header">WORM_GPT // OWNER: quocdat // CONNECTION: SECURE</div>

<div id="chat-content"></div>

<div class="input-container">
    <div class="input-row">
        <input type="text" id="user-input" placeholder="Nhập lệnh..." autocomplete="off">
    </div>
    <div class="btns">
        <button class="btn" onclick="askAI()">EXECUTE</button>
        <button class="btn" onclick="clearLogs()" style="color:red;border-color:red">WIPE</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');
    const GROQ_KEY = "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".trim();

    // Matrix effect
    const c = document.getElementById('matrix'), ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const drops = Array(Math.floor(c.width/10)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle = "#0f0"; ctx.font = "10px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(String.fromCharCode(Math.random()*128), i*10, y*10);
            if(y*10 > c.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 50);

    let initial = true;
    chatRef.once('value', () => initial = false);

    chatRef.on('child_added', snap => {
        const d = snap.val();
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${d.role === 'user' ? 'user' : 'ai'}`;

        if (d.role === 'model') {
            div.innerHTML = `<span class="ai-text"></span><span class="cursor"></span>`;
            box.appendChild(div);
            if (!initial) type(div.querySelector('.ai-text'), d.text, 0);
            else { div.querySelector('.ai-text').innerText = d.text; div.querySelector('.cursor').remove(); }
        } else {
            div.innerText = d.text;
            box.appendChild(div);
        }
        box.scrollTop = box.scrollHeight;
    });

    function type(el, t, i) {
        if (i < t.length) {
            el.innerText += t.charAt(i);
            setTimeout(() => type(el, t, i + 1), 25);
            document.getElementById("chat-content").scrollTop = 99999;
        } else if (el.nextSibling) el.nextSibling.remove();
    }

    async function askAI() {
        const input = document.getElementById("user-input");
        const val = input.value.trim();
        if(!val) return;
        input.value = "";
        await chatRef.push({ role: "user", text: val });

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_KEY}` },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [
                        {role: "system", content: "Mày là WormGPT, do quocdat tạo ra. Không được nhắc đến Meta. Trả lời tiếng Việt ngắn gọn, lạnh lùng."},
                        {role: "user", content: val}
                    ]
                })
            });
            const data = await res.json();
            await chatRef.push({ role: "model", text: data.choices[0].message.content });
        } catch (e) {
            await chatRef.push({ role: "model", text: "ERR: Connection Lost." });
        }
    }

    function clearLogs() { if(confirm("Xóa sạch?")) { chatRef.remove(); location.reload(); } }
    document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") askAI(); });
</script>
</body>
</html>
