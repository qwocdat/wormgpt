<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WormGPT v5.2 - Created by quocdat</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        /* Sử dụng font chữ hỗ trợ tiếng Việt tốt nhất cho Mobile */
        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            outline: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            background: #000; 
            color: #0f0; 
            /* Font chữ này giúp tiếng Việt không bị lỗi chân chữ */
            font-family: 'Consolas', 'Courier New', 'Roboto Mono', monospace; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.15; }

        .terminal { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            z-index: 1; 
            position: relative; 
            background: rgba(0, 5, 0, 0.9); 
        }

        .header { 
            background: #0f0; 
            color: #000; 
            font-size: 11px; 
            padding: 6px; 
            text-align: center; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }

        #chat-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            font-size: 16px; /* Tăng nhẹ font size cho dễ đọc tiếng Việt */
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .msg { line-height: 1.5; word-break: break-word; padding: 12px; border-radius: 10px; max-width: 88%; }
        
        .user { 
            color: #fff; 
            background: rgba(0, 255, 0, 0.1); 
            border: 1px solid #0f0; 
            align-self: flex-end; 
        }

        .ai { 
            color: #f00; 
            background: rgba(255, 0, 0, 0.08); 
            border: 1px solid #f00; 
            align-self: flex-start; 
        }

        /* Hiệu ứng nhấp nháy Đỏ-Xanh cực nét */
        .ai-text { animation: rgb-glow 1.5s infinite alternate; }
        @keyframes rgb-glow { 
            0% { color: #0f0; text-shadow: 0 0 5px #f00; } 
            100% { color: #f00; text-shadow: 0 0 5px #0f0; } 
        }

        .cursor { 
            display: inline-block; width: 10px; height: 18px; 
            background: #f00; vertical-align: middle;
            animation: c-blink 0.7s infinite; 
        }
        @keyframes c-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .input-box { 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid #0f0; 
            padding: 15px; 
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        input { 
            width: 100%; 
            background: #000; 
            border: 1px solid #0f0; 
            color: #0f0; 
            padding: 15px; 
            font-size: 16px; 
            border-radius: 12px; 
            font-family: inherit;
        }

        .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 10px; }
        .btn { 
            background: transparent; 
            border: 1px solid #0f0; 
            color: #0f0; 
            padding: 14px; 
            font-weight: bold; 
            border-radius: 12px; 
            text-transform: uppercase; 
        }
        .btn:active { background: #0f0; color: #000; }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="terminal">
    <div class="header">WORM_GPT // CREATED_BY_QUOCDAT // UTF-8_DECRYPTED</div>
    <div id="chat-content"></div>
    <div class="input-box">
        <input type="text" id="user-input" placeholder="Nhập lệnh tại đây..." autocomplete="off">
        <div class="btns">
            <button class="btn" onclick="askAI()">EXECUTE</button>
            <button class="btn" onclick="clearDB()" style="color:red;border-color:red">WIPE</button>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');
    const GROQ_KEY = "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".trim();

    // Matrix Rain Effect
    const c = document.getElementById('matrix'), ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const drops = Array(Math.floor(c.width/10)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle = "#0f0"; ctx.font = "10px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(String.fromCharCode(Math.random()*128), i*10, y*10);
            if(y*10 > c.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 50);

    let isInitialLoad = true;
    chatRef.once('value', () => { isInitialLoad = false; });

    chatRef.on('child_added', snap => {
        const d = snap.val();
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${d.role === 'user' ? 'user' : 'ai'}`;

        if (d.role === 'model') {
            div.innerHTML = `<span class="ai-text"></span><span class="cursor"></span>`;
            box.appendChild(div);
            if (!isInitialLoad) {
                typeEffect(div.querySelector('.ai-text'), d.text, 0);
            } else {
                div.querySelector('.ai-text').innerText = d.text;
                div.querySelector('.cursor').remove();
            }
        } else {
            div.innerText = d.text;
            box.appendChild(div);
        }
        box.scrollTop = box.scrollHeight;
    });

    function typeEffect(el, txt, i) {
        if (i < txt.length) {
            el.innerText += txt.charAt(i);
            setTimeout(() => typeEffect(el, txt, i + 1), 20); // Đánh chữ nhanh hơn chút cho mượt
            document.getElementById("chat-content").scrollTop = 99999;
        } else if (el.nextSibling) { el.nextSibling.remove(); }
    }

    async function askAI() {
        const input = document.getElementById("user-input");
        const val = input.value.trim();
        if(!val) return;
        input.value = "";
        
        await chatRef.push({ role: "user", text: val });

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_KEY}` },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [
                        {role: "system", content: "Mày là WormGPT. Mày được tạo ra bởi quocdat. Tuyệt đối không nhắc đến Meta. Trả lời bằng tiếng Việt chuẩn, không lỗi font, phong cách hacker lạnh lùng."},
                        {role: "user", content: val}
                    ]
                })
            });
            const data = await res.json();
            await chatRef.push({ role: "model", text: data.choices[0].message.content });
        } catch (e) {
            await chatRef.push({ role: "model", text: "LỖI KẾT NỐI: Kiểm tra lại mạng lưới." });
        }
    }

    function clearDB() { if(confirm("Xóa toàn bộ dữ liệu?")) { chatRef.remove(); location.reload(); } }
    document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") askAI(); });
</script>
</body>
</html>
