<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WormGPT Lite</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .terminal { width: 98vw; height: 96vh; border: 1px solid #0f0; display: flex; flex-direction: column; background: #000; position: relative; }
        .header { background: #0f0; color: #000; font-size: 10px; padding: 4px; text-align: center; font-weight: bold; }
        
        #chat-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
        .msg { line-height: 1.4; word-break: break-word; }
        .user { color: #fff; border-left: 2px solid #fff; padding-left: 5px; }
        .ai { color: #0f0; border-left: 2px solid #f00; padding-left: 5px; }
        .ai::before { content: "[WGPT]> "; color: #f00; font-weight: bold; }

        .input-box { border-top: 1px solid #0f0; padding: 8px; background: #050505; }
        #preview-box img { max-height: 60px; border: 1px solid #0f0; margin-bottom: 5px; }
        
        .row { display: flex; gap: 5px; }
        input[type="text"] { flex: 1; background: #000; border: 1px solid #0f0; color: #0f0; padding: 8px; font-size: 14px; outline: none; }
        
        .btns { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 5px; margin-top: 8px; }
        .btn { background: #000; border: 1px solid #0f0; color: #0f0; padding: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn:active { background: #0f0; color: #000; }
        #file-input { display: none; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">WORM_GPT_V3.2 // BY_DAT</div>
    <div id="chat-content"></div>
    
    <div class="input-box">
        <div id="preview-box"></div>
        <div class="row">
            <input type="text" id="user-input" placeholder="Execute..." autocomplete="off">
        </div>
        <div class="btns">
            <label for="file-input" class="btn">IMG</label>
            <input type="file" id="file-input" accept="image/*">
            <button class="btn" onclick="askAI()">EXECUTE</button>
            <button class="btn" onclick="clearCloud()" style="color:#f00; border-color:#f00;">WIPE</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnZVbkcjZmVH8QC2mX6en3Rl68D2UnNTE",
        authDomain: "keyquocdat.firebaseapp.com",
        databaseURL: "https://keyquocdat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "keyquocdat",
        storageBucket: "keyquocdat.firebasestorage.app",
        messagingSenderId: "940819957535",
        appId: "1:940819957535:web:6e8e9a4c9838740da3122a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('wormgpt_logs');

    const GEMINI_KEY = "AIzaSyCqt5-B4-brPMRHLOpP4OxgbnSc3XqBwWM";
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;

    let selectedImg = null;

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            selectedImg = ev.target.result.split(',')[1];
            document.getElementById('preview-box').innerHTML = `<img src="${ev.target.result}">`;
        };
        reader.readAsDataURL(file);
    };

    chatRef.on('child_added', (snap) => {
        const data = snap.val();
        const box = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = `msg ${data.role === 'user' ? 'user' : 'ai'}`;
        div.innerText = data.text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    async function askAI() {
        const input = document.getElementById("user-input");
        const prompt = input.value.trim();
        if (!prompt && !selectedImg) return;

        const currentImg = selectedImg;
        // Lưu tin nhắn gốc lên Firebase
        await chatRef.push({ role: "user", text: prompt || "[Image]" });
        
        input.value = "";
        selectedImg = null;
        document.getElementById('preview-box').innerHTML = "";

        try {
            // Chỉ lấy 6 tin nhắn gần nhất để tránh lỗi token
            const snap = await chatRef.limitToLast(6).once('value');
            let history = [];
            snap.forEach(c => {
                const val = c.val();
                history.push({
                    role: val.role === "user" ? "user" : "model",
                    parts: [{ text: val.text }]
                });
            });

            // Gắn ảnh vào tin nhắn cuối cùng nếu có
            if (currentImg && history.length > 0) {
                history[history.length - 1].parts.push({
                    inline_data: { mime_type: "image/jpeg", data: currentImg }
                });
            }

            const res = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: history })
            });

            const data = await res.json();
            
            if (data.candidates && data.candidates[0].content) {
                const aiText = data.candidates[0].content.parts[0].text;
                await chatRef.push({ role: "model", text: aiText });
            } else {
                throw new Error("Invalid API Response");
            }
        } catch (e) {
            console.error(e);
            await chatRef.push({ role: "model", text: "ERR: Neural Link Offline." });
        }
    }

    function clearCloud() {
        if(confirm("Wipe Memory?")) { chatRef.remove(); location.reload(); }
    }

    document.getElementById("user-input").addEventListener("keypress", (e) => { if(e.key === "Enter") askAI(); });
</script>
</body>
</html>
